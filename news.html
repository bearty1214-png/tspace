  <style>
    /* ====== 기본 설정 (색상·폰트는 여기서 바꾸면 전체에 적용돼요) ====== */
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.6);
      --line: rgba(255, 255, 255, 0.1);
      --accent: #4ade80;          /* "further and higher" 초록색 */
      --font-head: 'Abril Fatface', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      --header-h: 72px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ====== 헤더 ====== */
    .header {
      position: fixed;
      inset: 0 0 auto 0;
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(16px, 4vw, 48px);
      background: var(--bg);
      z-index: 100;
    }
    .logo img { height: 40px; width: auto; }

    .nav { display: flex; gap: 32px; }
    .nav a {
      font-family: var(--font-head);
      font-size: 1rem;
      letter-spacing: 0.05em;
      opacity: 0.85;
      transition: opacity .2s;
    }
    .nav a:hover { opacity: 1; }
    .nav a[aria-current="page"] { opacity: 1; text-decoration: underline; text-underline-offset: 6px; }

    .menu-btn {
      display: none;
      background: none;
      border: 0;
      width: 40px;
      height: 40px;
      cursor: pointer;
      position: relative;
    }
    .menu-btn span {
      position: absolute;
      left: 9px;
      width: 22px;
      height: 2px;
      background: var(--text);
      transition: transform .3s, opacity .3s, top .3s;
    }
    .menu-btn span:nth-child(1) { top: 13px; }
    .menu-btn span:nth-child(2) { top: 19px; }
    .menu-btn span:nth-child(3) { top: 25px; }
    .menu-open .menu-btn span:nth-child(1) { top: 19px; transform: rotate(45deg); }
    .menu-open .menu-btn span:nth-child(2) { opacity: 0; }
    .menu-open .menu-btn span:nth-child(3) { top: 19px; transform: rotate(-45deg); }

    /* 모바일 메뉴 */
    .mobile-menu {
      position: fixed;
      inset: var(--header-h) 0 0 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      z-index: 99;
    }
    .mobile-menu a { font-family: var(--font-head); font-size: 2rem; }
    .menu-open .mobile-menu { opacity: 1; pointer-events: auto; }

    @media (max-width: 768px) {
      .nav { display: none; }
      .menu-btn { display: block; }
    }


    /* ====== 언어 선택 ====== */
    .header-right { display: flex; align-items: center; gap: 28px; }
    .lang { display: flex; border: 1px solid rgba(255,255,255,.25); border-radius: 9999px; padding: 2px; }
    .lang button {
      background: none; border: 0; color: var(--muted); cursor: pointer;
      font: 600 .75rem/1 var(--font-body); letter-spacing: .08em;
      padding: 7px 11px; border-radius: 9999px; transition: background .2s, color .2s;
    }
    .lang button[aria-pressed="true"] { background: #fff; color: #000; }
    .lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 768px) { .header-right { gap: 12px; } }

    /* ====== 히어로 (영상 배경) ====== */
    .hero {
      position: relative;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .hero video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.05);
      pointer-events: none;
    }
    .hero::after {               /* 영상 위 살짝 어두운 막 */
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.2);
    }
    .hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 16px 40px;
      max-width: 1100px;
      animation: rise .8s ease-out both;
    }
    .hero h1 {
      font-family: var(--font-head);
      font-style: italic;
      text-transform: uppercase;
      font-size: clamp(3rem, 9vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      margin-bottom: 24px;
      text-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .hero p {
      font-family: var(--font-head);
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--accent);
    }
    .scroll-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      width: 24px;
      height: 38px;
      border: 2px solid rgba(255,255,255,.6);
      border-radius: 12px;
    }
    .scroll-hint::before {
      content: "";
      position: absolute;
      top: 7px;
      left: 50%;
      width: 4px;
      height: 8px;
      margin-left: -2px;
      border-radius: 2px;
      background: #fff;
      animation: wheel 1.6s infinite;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes wheel { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(12px); } }

    /* ====== ABOUT ====== */
    .about {
      padding: clamp(80px, 12vw, 160px) clamp(16px, 6vw, 80px);
      max-width: 960px;
      margin: 0 auto;
      text-align: center;
    }
    .about .label {
      font-size: .8rem;
      letter-spacing: .3em;
      color: var(--accent);
      margin-bottom: 20px;
    }
    .about h2 {
      font-family: var(--font-head);
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.1;
      margin-bottom: 28px;
    }
    .about p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.8;
      word-break: keep-all;
    }
    .about p + p { margin-top: 8px; }



    /* ====== ABOUT 소개글 · 사진 ====== */
    .about { max-width: 1100px; }
    .about-text { max-width: 640px; margin: 0 auto; text-align: left; display: grid; gap: 14px; }
    .about-text p + p { margin-top: 0; }
    .about-text strong { color: var(--text); font-weight: 600; }
    .gallery {
      margin-top: 64px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .gallery figure { margin: 0; text-align: left; }
    .gallery img {
      width: 100%; aspect-ratio: 16 / 10; object-fit: cover;
      border-radius: 12px; background: #111;
    }
    .gallery figcaption { margin-top: 10px; font-size: .85rem; color: var(--muted); letter-spacing: .02em; }
    @media (max-width: 600px) { .gallery { grid-template-columns: 1fr; } }

    /* ====== ROCKETS ====== */
    .rockets {
      padding: clamp(80px, 12vw, 160px) clamp(16px, 6vw, 80px);
      border-top: 1px solid var(--line);
    }
    .rockets-head { text-align: center; margin-bottom: 56px; }
    .rockets-head .label { font-size: .8rem; letter-spacing: .3em; color: var(--accent); margin-bottom: 20px; }
    .rockets-head h2 { font-family: var(--font-head); font-size: clamp(2rem, 5vw, 3.25rem); }
    .rocket-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .rocket {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      transition: transform .25s, border-color .25s;
    }
    .rocket:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.25); }
    .rocket-img {
      aspect-ratio: 4 / 3;
      background: #111 center / cover no-repeat;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.3);
      font-size: .85rem;
    }
    .rocket-body { padding: 22px 22px 26px; }
    .rocket-no { font-size: .75rem; letter-spacing: .2em; color: var(--accent); margin-bottom: 8px; }
    .rocket h3 { font-family: var(--font-head); font-size: 1.6rem; margin-bottom: 10px; }
    .rocket p { color: var(--muted); line-height: 1.7; font-size: .95rem; word-break: keep-all; }

    .rocket-img { position: relative; }
    .rocket-tag {
      position: absolute; top: 14px; left: 14px;
      font-size: .72rem; font-weight: 600; letter-spacing: .08em;
      padding: 6px 10px; border-radius: 9999px;
      background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
    }
    .rocket-tag.done { color: var(--accent); }
    .rocket-tag.dev { color: #facc15; }
    .rocket-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-top: 18px;
    }
    .stat { background: rgba(255,255,255,.05); border-radius: 10px; padding: 12px 10px; text-align: center; }
    .stat b { display: block; font-family: var(--font-head); font-size: 1.2rem; font-weight: 400; }
    .stat span { font-size: .78rem; color: var(--muted); }
    .rocket-grid.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); max-width: 1000px; }

    /* ====== NEWS ====== */
    .news {
      padding: clamp(80px, 12vw, 160px) clamp(16px, 6vw, 80px);
      border-top: 1px solid var(--line);
    }
    .news-head { text-align: center; margin-bottom: 56px; }
    .news-head .label { font-size: .8rem; letter-spacing: .3em; color: var(--accent); margin-bottom: 20px; }
    .news-head h2 { font-family: var(--font-head); font-size: clamp(2rem, 5vw, 3.25rem); }
    .news-list { max-width: 820px; margin: 0 auto; list-style: none; }
    .news-item {
      display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 24px;
      padding: 28px 0; border-top: 1px solid var(--line);
    }
    .news-item:last-child { border-bottom: 1px solid var(--line); }
    .news-date { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; padding-top: 4px; letter-spacing: .04em; }
    .news-tag {
      display: inline-block; margin-bottom: 12px;
      font-size: .72rem; font-weight: 600; letter-spacing: .08em;
      padding: 5px 10px; border-radius: 9999px;
      background: rgba(255,255,255,.06); color: var(--muted);
    }
    .news-tag.upcoming { color: #facc15; background: rgba(250,204,21,.1); }
    .news-tag.launch { color: var(--accent); background: rgba(74,222,128,.1); }
    .news-item h3 { font-family: var(--font-head); font-weight: 400; font-size: 1.45rem; margin-bottom: 8px; }
    .news-item p { color: var(--muted); line-height: 1.7; word-break: keep-all; }
    @media (max-width: 600px) { .news-item { grid-template-columns: 1fr; gap: 8px; } }

    /* ====== MISSION ====== */
    .mission { padding: clamp(80px, 12vw, 160px) clamp(16px, 6vw, 80px); border-top: 1px solid var(--line); }
    .mission-head { text-align: center; margin-bottom: 56px; }
    .mission-head .label { font-size: .8rem; letter-spacing: .3em; color: var(--accent); margin-bottom: 20px; }
    .mission-head h2 { font-family: var(--font-head); font-size: clamp(2rem, 5vw, 3.25rem); }
    .mission-card {
      max-width: 1000px; margin: 0 auto;
      display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
      background: rgba(255,255,255,.03);
    }
    .mission-img { min-height: 360px; background: #111 center / cover no-repeat; }
    .mission-body { padding: clamp(24px, 4vw, 44px); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .mission-kicker { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .mission-tag { font-size: .72rem; font-weight: 600; letter-spacing: .08em; padding: 6px 11px; border-radius: 9999px; color: #facc15; background: rgba(250,204,21,.1); }
    .mission-date { font-variant-numeric: tabular-nums; color: var(--muted); letter-spacing: .06em; }
    .mission-body h3 { font-family: var(--font-head); font-weight: 400; font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.1; }
    .mission-body p { color: var(--muted); line-height: 1.75; word-break: keep-all; }
    .mission-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .mission-stats .stat span { word-break: keep-all; }
    .mission-link { align-self: flex-start; margin-top: 4px; padding: 12px 18px; border-radius: 9999px; background: #fff; color: #000; font-weight: 600; font-size: .9rem; transition: opacity .2s; }
    .mission-link:hover { opacity: .85; }
    .mission-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 760px) { .mission-card { grid-template-columns: 1fr; } .mission-img { min-height: 0; aspect-ratio: 16 / 10; } }

    /* ====== NEWS PAGE ====== */
    .news-page { padding: calc(var(--header-h) + env(safe-area-inset-top, 0px) + clamp(48px, 8vw, 96px)) clamp(16px, 6vw, 80px) clamp(80px, 12vw, 140px); }
    .np-head { text-align: center; margin-bottom: 56px; }
    .np-head .label { font-size: .8rem; letter-spacing: .3em; color: var(--accent); margin-bottom: 20px; }
    .np-head h1 { font-family: var(--font-head); font-weight: 400; font-size: clamp(2.4rem, 6vw, 4rem); line-height: 1; margin-bottom: 14px; }
    .np-head p { color: var(--muted); }
    .ncards { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 20px; }
    .ncard {
      appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; padding: 0;
      display: flex; flex-direction: column; min-width: 0;
      background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
      transition: transform .25s, border-color .25s;
    }
    .ncard:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.25); }
    .ncard:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .nbody { padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .nmeta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .nmeta .news-date { padding: 0; font-size: .85rem; }
    .nmeta .news-tag { margin: 0; }
    .nbody h2 { font-family: var(--font-head); font-weight: 400; font-size: 1.35rem; line-height: 1.2; }
    .nbody p { color: var(--muted); font-size: .93rem; line-height: 1.65; word-break: keep-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .nmore { margin-top: auto; padding-top: 6px; font-size: .85rem; font-weight: 600; }
    .ndlg {
      margin: auto; padding: 0; border: 1px solid var(--line); border-radius: 18px; background: #0b0b0b; color: var(--text);
      width: min(720px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto;
    }
    .ndlg::backdrop { background: rgba(0,0,0,.72); backdrop-filter: blur(4px); }
    .ndlg .nimg { aspect-ratio: 16 / 9; }
    .ndlg-body { padding: 28px clamp(20px, 4vw, 36px) 36px; display: grid; gap: 14px; }
    .ndlg h2 { font-family: var(--font-head); font-weight: 400; font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.15; }
    .ndlg p { color: rgba(255,255,255,.8); line-height: 1.85; word-break: keep-all; }
    .ndlg-close {
      position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 9999px; border: 0;
      background: rgba(0,0,0,.6); color: #fff; font-size: 1rem; cursor: pointer; backdrop-filter: blur(6px);
    }
    .ndlg-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ====== 푸터 ====== */
    .footer {
      border-top: 1px solid var(--line);
      padding: 56px clamp(16px, 4vw, 48px) 40px;
    }
    .footer-top {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto;
    }
    .footer .logo img { height: 48px; }
    .footer-nav { display: flex; gap: 28px; font-family: var(--font-head); }
    .socials { display: flex; gap: 12px; }
    .socials a {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 9999px;
      background: rgba(255,255,255,.06);
      transition: background .2s;
    }
    .socials a:hover { background: rgba(255,255,255,.16); }
    .socials svg { width: 18px; height: 18px; fill: #fff; }
    .footer-bottom {
      max-width: 1200px;
      margin: 40px auto 0;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      font-size: .875rem;
      color: var(--muted);
    }
    .footer-bottom a:hover { color: #fff; }
    .header { padding-top: env(safe-area-inset-top, 0px); height: calc(var(--header-h) + env(safe-area-inset-top, 0px)); }
    .mobile-menu { inset: calc(var(--header-h) + env(safe-area-inset-top, 0px)) 0 0 0; }
  </style>
</head>

    (function () {
      var DICT = window.TS_DICT = { ko: {"about1":"TSPACE는 2023년 12월에 만들어졌으며, 로켓 설계부터 제작, 발사까지 직접 합니다.","about2":"첫 로켓 <strong>SpinV</strong>는 총 9번 발사를 진행했고, 5번째 비행에서 처음 성공했습니다.","about3":"두 번째 로켓 <strong>NOVA</strong>는 현재 개발 중이며, 2027년 2월 첫 발사 예정입니다.","cap1":"F8 발사","cap2":"점화 순간","cap3":"F5 · 첫 발사 성공","cap4":"NOVA 엔진 연소 시험","tagDone":"● 개발 완료","tagDev":"● 개발 중","spinDesc":"개발을 마친 첫 번째 로켓입니다. 지금까지 총 9번 발사했고, 5번째 비행(F5)에서 첫 발사 성공을 거뒀습니다.","stLaunchN":"9회","stLaunch":"총 발사","stFirst":"첫 발사 성공","stAlt":"최대 고도","novaDesc":"SpinV보다 엔진은 3배 강하고 크기는 2배 커진 두 번째 로켓입니다. 소형 엔진 3개와 대형 엔진 1개를 묶은 클러스터링 방식으로 비행하며, 지금 개발 중입니다.","stEngine":"엔진 출력","stTarget":"목표 최대 고도","stPlan":"첫 발사 예정","nTagUp":"예정","nTagNews":"소식","n1t":"NOVA 첫 발사 예정","n1d":"두 번째 로켓 NOVA의 첫 발사를 2027년 2월에 할 예정입니다. 지금 개발 중입니다.","n2t":"공식 사이트 리뉴얼","n2d":"공식 사이트가 새롭게 리뉴얼 되었습니다.","n3t":"TSPACE 시작","n3d":"TSPACE는 2023년 12월에 만들어졌습니다.","nTagDev":"개발","nTagLaunch":"발사","n4t":"NOVA 엔진 구성 변경","n4d":"NOVA의 엔진 개수와 마운트 설계를 수정했습니다. 소형 엔진 3개와 대형 엔진 1개를 묶는 클러스터링 방식으로 비행합니다.","n5t":"SpinV 마지막 발사 (F9)","n5d":"SpinV의 아홉 번째이자 마지막 발사를 진행했습니다.","n6t":"SpinV 첫 발사 성공 (F5)","n6d":"다섯 번째 비행에서 SpinV가 처음으로 발사에 성공했습니다.","mTag":"다음 발사","mTitle":"NOVA 첫 발사 예정","mDesc":"두 번째 로켓 NOVA의 첫 발사를 2027년 2월에 할 예정입니다. 소형 엔진 3개와 대형 엔진 1개를 묶은 클러스터링 방식으로 목표 고도 150m에 도전합니다.","mEng":"클러스터 엔진","mStatus":"개발 중","mStatusL":"현재 상태","mLink":"소식 전체 보기 →","nMore":"자세히 보기 →","newsSub":"TSPACE의 개발과 발사 소식","n1b":"TSPACE의 두 번째 로켓 NOVA가 2027년 2월 첫 발사를 준비하고 있습니다. NOVA는 SpinV보다 엔진은 3배 강하고 크기는 2배 큽니다. 소형 엔진 3개와 대형 엔진 1개를 묶은 클러스터링 방식으로 비행하며, 목표 최대 고도는 150m입니다.","n4b":"NOVA의 엔진 개수와 마운트 설계를 수정했습니다. 이번 업데이트로 NOVA에는 소형 엔진 3개와 대형 엔진 1개가 장착되며, 여러 엔진을 함께 쓰는 클러스터링 방식으로 발사하고 비행할 수 있게 됐습니다.","n2b":"공식 사이트가 새롭게 리뉴얼 되었습니다.","n5b":"2025년 12월 13일, SpinV의 아홉 번째 비행(F9)을 진행했습니다. F9는 SpinV의 마지막 발사로, SpinV는 총 9번의 발사를 마쳤습니다.","n6b":"2024년 12월 27일, SpinV가 다섯 번째 비행(F5)에서 처음으로 발사에 성공했습니다. 앞선 네 번의 시도 끝에 거둔 첫 성공입니다. SpinV의 최고 고도 기록은 70m입니다.","n3b":"TSPACE는 2023년 12월에 만들어졌습니다."}, en: {"about1":"TSPACE was started in December 2023 and handles everything from rocket design to building and launching.","about2":"The first rocket, <strong>SpinV</strong>, has launched 9 times and flew successfully for the first time on its 5th flight.","about3":"The second rocket, <strong>NOVA</strong>, is currently in development, with its first launch planned for February 2027.","cap1":"F8 launch","cap2":"Ignition","cap3":"F5 · First successful launch","cap4":"NOVA engine test fire","tagDone":"● Completed","tagDev":"● In development","spinDesc":"The first completed rocket. It has launched 9 times in total, with its first successful flight on F5, the 5th flight.","stLaunchN":"9","stLaunch":"Launches","stFirst":"First success","stAlt":"Max altitude","novaDesc":"The second rocket, 3× more powerful and twice the size of SpinV. It flies on a cluster of three small engines and one large engine, and is currently in development.","stEngine":"Engine power","stTarget":"Target altitude","stPlan":"First launch","nTagUp":"Upcoming","nTagNews":"News","n1t":"NOVA first launch planned","n1d":"The first launch of our second rocket, NOVA, is planned for February 2027. It is currently in development.","n2t":"Official website renewed","n2d":"The official website has been renewed.","n3t":"TSPACE begins","n3d":"TSPACE was founded in December 2023.","nTagDev":"Development","nTagLaunch":"Launch","n4t":"NOVA engine layout updated","n4d":"We revised NOVA's engine count and mount design. It now flies with a cluster of three small engines and one large engine.","n5t":"SpinV final launch (F9)","n5d":"SpinV made its ninth and final launch.","n6t":"SpinV first successful launch (F5)","n6d":"SpinV flew successfully for the first time on its fifth flight.","mTag":"Next launch","mTitle":"NOVA first launch","mDesc":"Our second rocket, NOVA, is set for its first launch in February 2027. Flying on a cluster of three small engines and one large engine, it aims for a target altitude of 150 m.","mEng":"Clustered engines","mStatus":"In progress","mStatusL":"Status","mLink":"See all news →","nMore":"Read more →","newsSub":"Development and launch updates from TSPACE","n1b":"TSPACE's second rocket, NOVA, is preparing for its first launch in February 2027. NOVA has engines three times more powerful than SpinV and a body twice the size. It flies on a cluster of three small engines and one large engine, with a target maximum altitude of 150 m.","n4b":"We revised NOVA's engine count and mount design. With this update, NOVA carries three small engines and one large engine, and can launch and fly using a clustered configuration that fires multiple engines together.","n2b":"The official website has been renewed.","n5b":"On December 13, 2025, SpinV made its ninth flight, F9. F9 was SpinV's final launch, bringing its total to nine launches.","n6b":"On December 27, 2024, SpinV flew successfully for the first time on its fifth flight, F5, after four earlier attempts. SpinV's highest recorded altitude is 70 m.","n3b":"TSPACE was founded in December 2023."} };

        try { localStorage.setItem('tspace-lang', lang); } catch (e) {}

        b.addEventListener('click', function () { setLang(b.getAttribute('data-set-lang')); });
      });
      var saved = null;
      try { saved = localStorage.getItem('tspace-lang'); } catch (e) {}
      setLang(saved || 'ko');
    })();

      function open(card) {
        var img = card.getAttribute('data-img');
        document.getElementById('ndlg-img').className = img === 'logo' ? 'nimg logo' : 'nimg img-' + img;

        try { history.replaceState(null, '', '#' + card.getAttribute('data-id')); } catch (e) {}
      }
      function close() { if (dlg.open) { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); } }
      dlg.addEventListener('close', function () {
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      });
      document.querySelectorAll('.ncard').forEach(function (c) {
        c.addEventListener('click', function () { open(c); });
      });
      dlg.querySelector('.ndlg-close').addEventListener('click', close);
      dlg.addEventListener('click', function (e) { if (e.target === dlg) close(); });
      function fromHash() {
        var id = location.hash.slice(1);
        var c = id && document.querySelector('.ncard[data-id="' + id + '"]');
        if (c) open(c);
      }
      window.addEventListener('hashchange', fromHash);
      fromHash();
    })();
  </script>
</body>
</html>
